<!DOCTYPE html>
<html>
<head>
  <title>Charts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-warning px-3">
  <span class="navbar-brand text-dark">📊 Attendance Charts</span>
  <a href="/dashboard" class="btn btn-sm btn-dark">Back</a>
</nav>

<div class="container mt-4 text-center">
  <div class="card shadow">
    <div class="card-body">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-3">
        <div class="text-start">
          <h5 class="mb-1">Daily IN Count</h5>
          <small class="text-muted">Date: {{ chart_pretty_date }}</small>
        </div>
        <form method="get" action="/charts" class="d-flex align-items-end gap-2">
          <div class="text-start">
            <label for="chartDate" class="form-label mb-1">Select date</label>
            <input id="chartDate" name="date" type="date" class="form-control" value="{{ chart_date }}">
          </div>
          <button class="btn btn-warning" type="submit">Load</button>
        </form>
      </div>

      <div style="height: 420px;">
        <canvas id="attendanceChart"></canvas>
      </div>
      <p id="emptyMessage" class="text-muted mt-3 d-none">No IN records found for this date.</p>
    </div>
  </div>
</div>

<script>
  const labels = {{ chart_labels | tojson }};
  const values = {{ chart_values | tojson }};

  if (!labels.length) {
    document.getElementById("emptyMessage").classList.remove("d-none");
  }

  const ctx = document.getElementById("attendanceChart");
  new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "IN count",
        data: values,
        backgroundColor: "rgba(255, 193, 7, 0.75)",
        borderColor: "rgba(255, 193, 7, 1)",
        borderWidth: 1,
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          beginAtZero: true,
          ticks: {
            precision: 0
          }
        }
      },
      plugins: {
        legend: {
          display: false
        }
      }
    }
  });
</script>

</body>
</html>
